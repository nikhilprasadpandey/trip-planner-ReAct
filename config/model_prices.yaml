# Per-model token price table (USD per 1M tokens), used by
# src/trip_planner/cost/ledger.py to compute the agent-operating-cost side
# of the dual cost ledger (see spec §3.5).
#
# Verify against current pricing before relying on this financially —
# https://openai.com/api/pricing (cached here as of 2026-06-24, gpt-4.1
# launch pricing).

default_model: gpt-4.1   # used by Weather/Flight/Policy agents (routine, high-volume)
orchestrator_model: gpt-4.1   # planning step

models:
  gpt-4.1:
    input_per_1m_usd: 2.00
    output_per_1m_usd: 8.00
    cache_write_per_1m_usd: 2.00   # OpenAI's automatic prompt caching has no separate write charge
    cache_read_per_1m_usd: 0.50

# Embeddings (Policy Agent RAG) use OpenAI text-embedding-3-small directly
# (~$0.02 / 1M tokens as of 2026-06-24 — verify before relying on this
# financially). Same OPENAI_API_KEY as the agent LLM calls above — one
# provider, one key, for both.
embeddings:
  text-embedding-3-small:
    input_per_1m_usd: 0.02
