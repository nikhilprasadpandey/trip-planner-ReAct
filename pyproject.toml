[project]
name = "trip-planner-react"
version = "0.1.0"
description = "Corporate Travel Planner & Policy-Compliance Agent — ReAct multi-agent, MCP, Qdrant RAG, guardrails, audit, cost, auth"
requires-python = ">=3.13"
readme = "README.md"

dependencies = [
    # LLM + orchestration
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2.0",
    # MCP
    "mcp>=1.2.0",
    "langchain-mcp-adapters>=0.0.5",
    # Vector DB / RAG
    "qdrant-client>=1.12.0",
    "openai>=1.50.0",   # Azure OpenAI embeddings client only (text-embedding-3-small) — LLM calls stay on Anthropic
    # API gateway + UI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "streamlit>=1.39.0",
    "slowapi>=0.1.9",
    # Audit store
    "sqlalchemy>=2.0.0",
    # Cache
    "cachetools>=5.5.0",
    # Observability
    "langfuse>=2.53.0",
    # Config / utils
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
